<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>手机端-模拟IOT数据</title>
    <script src="./js/axios.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 20px;
            color: #edf7ff;
            font-family: "Microsoft YaHei", "Segoe UI", Arial, sans-serif;
            background:
                linear-gradient(180deg, rgba(7, 17, 28, 0.78), rgba(7, 17, 28, 0.94)),
                url("./image/bj.jpg") center / cover no-repeat fixed;
        }

        .phone-panel {
            width: min(420px, 100%);
            padding: 24px;
            border: 1px solid rgba(56, 213, 255, 0.28);
            border-radius: 8px;
            background: rgba(10, 24, 38, 0.9);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.38);
        }

        h1 {
            margin: 0 0 18px;
            font-size: 24px;
            line-height: 1.2;
        }

        label {
            display: grid;
            gap: 7px;
            margin-bottom: 14px;
            color: #94a9bd;
            font-size: 14px;
        }

        input,
        select {
            width: 100%;
            min-height: 42px;
            border: 1px solid rgba(148, 169, 189, 0.34);
            border-radius: 6px;
            color: #edf7ff;
            background: rgba(3, 10, 18, 0.78);
            padding: 0 12px;
            font: inherit;
            outline: none;
        }

        input:focus,
        select:focus {
            border-color: #38d5ff;
            box-shadow: 0 0 0 3px rgba(56, 213, 255, 0.14);
        }

        button {
            width: 100%;
            min-height: 44px;
            border: 0;
            border-radius: 6px;
            color: #05111c;
            background: linear-gradient(180deg, #38d5ff, #22c55e);
            font: inherit;
            font-weight: 800;
            cursor: pointer;
        }
    </style>
</head>
<body>
<section class="phone-panel">
    <h1>模拟 IOT 数据</h1>
    <label>
        温度
        <input type="text" id="wendu" value="28">
    </label>
    <label>
        湿度
        <input type="text" id="shidu" value="40">
    </label>
    <label>
        人体感知
        <select id="hongwai">
            <option value="1">有人</option>
            <option value="0">无人</option>
        </select>
    </label>
    <button onclick="sendMessage()">发送</button>
</section>
<script>
    function sendMessage() {
        let wendu = document.getElementById('wendu').value;
        let shidu = document.getElementById('shidu').value;
        let hongwai = document.getElementById('hongwai').value;
        axios.get('/websocket/sendmessage', {
            params: {
                wendu: wendu,
                shidu: shidu,
                hongwai: hongwai
            }
        })
            .then(function (response) {
                console.log(response);
            })
            .catch(function (error) {
                console.log(error);
            });
    }
</script>
</body>
</html>
